<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Nnamdi — Frontend Developer</title>
    <meta
      name="description"
      content="Michael Nnamdi is a frontend developer building things with React. TypeScript, Tailwind and Next.js — shipped projects and a published learning roadmap."
    />

    <!--
      Sharing metadata.

      `og:image` and `og:url` are specified as absolute URLs, and crawlers do not
      reliably resolve relative ones. There is no canonical domain yet, so the image
      is root-relative (matching the `/assets/...` paths Vite already emits). When the
      site goes live, prefix it with the origin, add `og:url`, and add a
      <link rel="canonical"> — all three need the same origin.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Michael Nnamdi" />
    <meta property="og:title" content="Michael Nnamdi — Frontend Developer" />
    <meta
      property="og:description"
      content="I build things with React. Shipped projects, honest skills and a published roadmap — one deployed project at a time."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Michael Nnamdi — Frontend Developer"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Michael Nnamdi — Frontend Developer" />
    <meta
      name="twitter:description"
      content="I build things with React. Shipped projects, honest skills and a published roadmap — one deployed project at a time."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110d" media="(prefers-color-scheme: dark)" />

    <!--
      Theme bootstrap. Runs before first paint so a dark-mode visitor never sees the
      light background flash. lib/theme.ts reads the class this script sets; the two
      must agree on the 'theme' localStorage key and the 'dark' class name.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* private-mode storage failures must not block render */
        }
      })();
    </script>

    <!-- Icons. `public/favicon.svg` is the source; regenerate rasters with `npm run assets`. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src-v2/main.tsx"></script>
  </body>
</html>
